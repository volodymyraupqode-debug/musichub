# MusicHub local services (ARCHITECTURE.md §8). Usage: see infra/README.md.
# Host ports are configurable via infra/.env (copy infra/.env.example).
name: musichub

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: musichub
      POSTGRES_USER: musichub
      POSTGRES_PASSWORD: musichub
    ports:
      - '${POSTGRES_PORT:-54320}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U musichub -d musichub']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage: BLOCKED. MinIO no longer publishes container images
  # (Docker Hub repository removed, quay.io requires auth). A replacement needs
  # owner approval (PROJECT_SPEC.md §5.2); Laravel's s3 disk is provider-agnostic.

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
