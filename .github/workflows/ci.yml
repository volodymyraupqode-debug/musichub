# MusicHub CI (ROADMAP.md S1-10). Every job must pass; there are no optional steps.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS (format, lint, types, boundaries, tests, build, codegen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: node -v && pnpm -v
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Codegen drift check
        run: |
          pnpm codegen
          git diff --exit-code -- packages/api-client/src/generated
      - name: Lint, typecheck, unit tests, build
        run: pnpm turbo run lint typecheck test build
      - name: Package boundaries
        run: pnpm depcruise

  php:
    name: PHP (Pint, Larastan, Pest on PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: musichub_test
          POSTGRES_USER: musichub
          POSTGRES_PASSWORD: musichub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U musichub -d musichub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, zip
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Pint + Larastan
        run: composer lint
      - name: Pest
        run: composer test

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: js
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @musichub/web exec playwright install --with-deps chromium
      - name: Playwright smoke (no API in this job, expects API unavailable)
        run: pnpm turbo run test:e2e --filter=@musichub/web
        env:
          E2E_EXPECT_API: unavailable
          API_INTERNAL_URL: http://127.0.0.1:9
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
