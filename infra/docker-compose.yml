# MusicHub local services (ARCHITECTURE.md §8). Usage: see infra/README.md.
# Host ports are configurable via infra/.env (copy infra/.env.example).
name: musichub

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: musichub
      POSTGRES_USER: musichub
      POSTGRES_PASSWORD: musichub
    ports:
      - '${POSTGRES_PORT:-54320}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U musichub -d musichub']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for development and CI (ADR-0007).
  # Single node: `weed mini` runs master, volume, filer and the S3 gateway (port 8333).
  # Credentials come from the environment (infra/.env or the shell); the defaults are
  # local-only dev values and must never be used outside a developer machine.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: ['mini', '-dir=/data', '-ip=seaweedfs', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-musichub}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-musichub-secret}
    ports:
      - '${S3_PORT:-8333}:8333'
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-shot bucket bootstrap: creates the bucket only if it is missing (idempotent),
  # then verifies it exists. Re-running `up` is safe.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.54
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-musichub-local}
    entrypoint: ['/bin/sh', '/init/create-bucket.sh']
    volumes:
      - ./seaweedfs/create-bucket.sh:/init/create-bucket.sh:ro
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
